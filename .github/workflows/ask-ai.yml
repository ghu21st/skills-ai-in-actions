name: Ask AI
on: 
  workflow_dispatch:

jobs:
  ask-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install openai

      - name: Run Script with Free AI Endpoint
        env:
          # Google AI Studio OpenAI - compatible variabales
          #OPENAI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
          OPENAI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
          OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - << 'EOF'
          import os
          from openai import OpenAI

          # The client will automatically read global env
          client = OpenAI()

          messages = [
              {"role": "system", "content": "You are a helpful assistant."},
              {"role": "user", "content": "Hello, please provide a programmer joke"}
          ]

          try: 
              response = client.chat.completions.create(
                  model="gemini-2.5-flash",  
                  messages=messages
              )
              print("AI response:\n", response.choices[0].message.content)
          except Exception as e:
              print(f"Error calling AI API: {e}")
              exit(1)
          EOF
                  
          
          
          
          
